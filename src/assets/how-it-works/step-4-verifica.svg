<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Filtros de sombra y brillo -->
    <filter id="check-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#16a34a" flood-opacity="0.35" />
    </filter>
    <filter id="wallet-shadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>

    <!-- Gradientes -->
    <radialGradient id="bg-halo-4" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#dcfce7" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#f0fdf4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0" />
    </radialGradient>

    <!-- Billetera azul marino profundo -->
    <linearGradient id="wallet-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="60%" stop-color="#122142" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>

    <!-- Dispositivo TAG Verde Telepeaje -->
    <linearGradient id="tag-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Tarjeta bancaria azul -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0057a3" />
    </linearGradient>

    <!-- Sello verde de éxito -->
    <linearGradient id="success-seal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
  </defs>

  <!-- Halo de iluminación de fondo -->
  <ellipse cx="160" cy="100" rx="140" ry="85" fill="url(#bg-halo-4)" />

  <!-- Badge superior oficial: CON PAGO VÁLIDO → COBRO REALIZADO -->
  <g transform="translate(65, 12)">
    <rect x="0" y="0" width="190" height="26" rx="13" fill="#ecfdf5" stroke="#86efac" stroke-width="1.2" />
    <circle cx="16" cy="13" r="7.5" fill="#22c55e" />
    <path d="M12.5 13 L15 15.5 L19.5 10.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <text x="30" y="16.5" font-family="'Segoe UI', Inter, sans-serif" font-size="8" font-weight="800" fill="#15803d" letter-spacing="0.5">CON PAGO VÁLIDO · COBRO REALIZADO</text>
  </g>

  <!-- Conjunto central de medios de pago -->
  <g id="payment-assembly" transform="translate(60, 48)">

    <!-- Tarjeta Bancaria (asomando hacia la derecha) -->
    <g id="bank-card" transform="translate(68, 6) rotate(6)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="112" height="70" rx="6" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="0.8" />
      <!-- Banda magnética -->
      <rect x="0" y="12" width="112" height="12" fill="#0f172a" />
      <!-- Chip EMV dorado -->
      <rect x="14" y="32" width="15" height="12" rx="2" fill="#fbbf24" stroke="#d97706" stroke-width="0.8" />
      <line x1="21.5" y1="32" x2="21.5" y2="44" stroke="#b45309" stroke-width="0.6" />
      <!-- Relieve numérico simulado -->
      <line x1="36" y1="38" x2="95" y2="38" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
      <!-- Logo de red de pago -->
      <circle cx="85" cy="54" r="6" fill="#ef4444" opacity="0.8" />
      <circle cx="94" cy="54" r="6" fill="#f59e0b" opacity="0.8" />
    </g>

    <!-- Dispositivo / Sticker TAG RFID Telepeaje (asomando hacia la izquierda) -->
    <g id="tag-device" transform="translate(4, 0) rotate(-8)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="108" height="66" rx="6" fill="url(#tag-grad)" stroke="#86efac" stroke-width="1.2" />
      <!-- Orificio / antena RFID -->
      <circle cx="92" cy="14" r="3.5" fill="#14532d" />
      <circle cx="92" cy="14" r="1.8" fill="#86efac" />
      <!-- Ondas RFID -->
      <path d="M85 24 Q95 24 95 34" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
      <path d="M80 24 Q98 24 98 42" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />
      <!-- Texto TAG destacado -->
      <text x="35" y="44" font-family="'Segoe UI', Inter, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="2">TAG</text>
      <!-- Subtítulo telepeaje -->
      <text x="36" y="55" font-family="'Segoe UI', Inter, sans-serif" font-size="6" font-weight="700" fill="#bbf7d0" letter-spacing="1">VENVÍAS TELEPEAJE</text>
    </g>

    <!-- Billetera institucional VenVías en primer plano -->
    <g id="wallet-front" transform="translate(10, 36)" filter="url(#wallet-shadow)">
      <!-- Cuerpo principal de la billetera -->
      <rect x="0" y="0" width="145" height="92" rx="10" fill="url(#wallet-grad)" stroke="#334155" stroke-width="1.2" />
      <!-- Pespunte perimetral / Costura de cuero -->
      <rect x="3" y="3" width="139" height="86" rx="8" fill="none" stroke="#5fa8e8" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />

      <!-- Bolsillo divisor frontal -->
      <path d="M0 32 Q72.5 38 145 32 L145 92 L0 92 Z" fill="#0f172a" opacity="0.3" />

      <!-- Broche de cierre con botón metálico -->
      <g transform="translate(115, 34)">
        <path d="M0 0 L24 0 Q30 0 30 11 Q30 22 24 22 L0 22 Z" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="11" r="5" fill="#94a3b8" />
        <circle cx="18" cy="11" r="2.5" fill="#ffffff" />
      </g>

      <!-- Logo sutil VenVías grabado en bajo relieve -->
      <text x="18" y="72" font-family="'Segoe UI', Inter, sans-serif" font-size="9" font-weight="900" fill="#38bdf8" letter-spacing="0.8" opacity="0.85">SALDO DISPONIBLE</text>
      <text x="18" y="82" font-family="'Segoe UI', Inter, sans-serif" font-size="6.5" font-weight="600" fill="#94a3b8">Débito Inmediato · Facturación OK</text>
    </g>

    <!-- Gran Sello Verde de Pago Verificado y Cobro Realizado -->
    <g id="success-check-badge" transform="translate(122, 60)" filter="url(#check-shadow)">
      <!-- Resplandor exterior -->
      <circle cx="28" cy="28" r="30" fill="#ffffff" opacity="0.9" />
      <!-- Círculo principal verde esmeralda con gradiente -->
      <circle cx="28" cy="28" r="27" fill="url(#success-seal)" stroke="#ffffff" stroke-width="3" />
      <!-- Checkmark en relieve blanco -->
      <path d="M16 28 L24 36 L40 19" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
