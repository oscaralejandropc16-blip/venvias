<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Filtros de sombra y brillo -->
    <filter id="scan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="plate-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
    <filter id="cam-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="6" stdDeviation="5" flood-color="#122142" flood-opacity="0.22" />
    </filter>

    <!-- Gradientes -->
    <radialGradient id="bg-halo-2" cx="55%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#f0f9ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0" />
    </radialGradient>

    <!-- Haz de escaneo óptico láser -->
    <linearGradient id="scan-beam" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="85%" stop-color="#0057a3" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0057a3" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cam-housing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="plate-gloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Halo de fondo -->
  <ellipse cx="170" cy="100" rx="140" ry="85" fill="url(#bg-halo-2)" />

  <!-- Haz de escaneo ALPR volumétrico proyectado hacia la placa -->
  <polygon points="68,68 135,42 295,78 295,160 145,152 68,76" fill="url(#scan-beam)" />
  <line x1="68" y1="72" x2="215" y2="108" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" />
  <line x1="68" y1="72" x2="145" y2="70" stroke="#00f2fe" stroke-width="1.2" opacity="0.7" />
  <line x1="68" y1="72" x2="285" y2="135" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.6" />

  <!-- Cámara ALPR de alta velocidad con iluminación infrarroja estroboscópica -->
  <g id="alpr-camera" filter="url(#cam-shadow)">
    <!-- Brazo de montaje articulado a la estructura -->
    <path d="M12 25 L38 25 L45 55 L32 58 Z" fill="#334155" />
    <circle cx="38" cy="56" r="6" fill="#1e293b" />
    <circle cx="38" cy="56" r="3" fill="#64748b" />

    <!-- Carcasa principal aerodinámica de la cámara -->
    <path d="M36 50 L84 35 L88 78 L40 85 Z" fill="url(#cam-housing)" stroke="#94a3b8" stroke-width="0.8" />
    <!-- Visera protectora antideslumbrante -->
    <path d="M30 47 L94 28 L94 38 L34 56 Z" fill="#1e293b" />

    <!-- Frontal óptico oscuro -->
    <path d="M84 36 L92 34 L95 76 L87 78 Z" fill="#0f172a" />

    <!-- Lente ALPR principal con halo infrarrojo estroboscópico -->
    <ellipse cx="89" cy="54" rx="4.5" ry="7" fill="#0284c7" />
    <ellipse cx="90" cy="54" rx="3" ry="5" fill="#38bdf8" filter="url(#scan-glow)" />
    <ellipse cx="90.5" cy="53.5" rx="1.2" ry="2.2" fill="#ffffff" />

    <!-- Emisores LED infrarrojos estroboscópicos auxiliares -->
    <circle cx="89" cy="42" r="1.8" fill="#ef4444" opacity="0.9" />
    <circle cx="89" cy="46" r="1.8" fill="#ef4444" opacity="0.9" />
    <circle cx="89" cy="65" r="1.8" fill="#ef4444" opacity="0.9" />
    <circle cx="89" cy="69" r="1.8" fill="#ef4444" opacity="0.9" />

    <!-- Sensor LED de estado activo -->
    <circle cx="48" cy="74" r="2" fill="#22c55e" />
    <text x="53" y="76" font-family="'Segoe UI', Inter, sans-serif" font-size="4.5" font-weight="700" fill="#0057a3">ALPR ON</text>
  </g>

  <!-- Placa vehicular oficial de Venezuela en primer plano escaneada -->
  <g id="scanned-plate" transform="translate(138, 55)" filter="url(#plate-shadow)">
    <!-- Marco exterior de protección negro -->
    <rect x="-3" y="-3" width="166" height="96" rx="8" fill="#0f172a" />

    <!-- Chapa metálica blanca reflectante con brillo -->
    <rect x="0" y="0" width="160" height="90" rx="6" fill="url(#plate-gloss)" stroke="#0057a3" stroke-width="1.8" />

    <!-- Orificios de sujeción -->
    <circle cx="15" cy="14" r="3.2" fill="#94a3b8" />
    <circle cx="145" cy="14" r="3.2" fill="#94a3b8" />
    <circle cx="15" cy="76" r="3.2" fill="#94a3b8" />
    <circle cx="145" cy="76" r="3.2" fill="#94a3b8" />

    <!-- Franja superior azul institucional de Venezuela -->
    <path d="M2 2 L158 2 Q158 20 158 22 L2 22 Z" fill="#0057a3" />
    <!-- Franjas sutiles bandera (amarillo, azul, rojo) -->
    <rect x="2" y="2" width="156" height="2" fill="#eab308" />
    <rect x="2" y="4" width="156" height="2" fill="#0057a3" />
    <rect x="2" y="6" width="156" height="1.5" fill="#dc2626" />

    <!-- Texto superior República Bolivariana de Venezuela -->
    <text x="80" y="16.5" font-family="'Segoe UI', Inter, sans-serif" font-size="7" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">VENEZUELA</text>

    <!-- Holograma de seguridad / Escudo -->
    <rect x="18" y="27" width="12" height="14" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8" />
    <circle cx="24" cy="34" r="3.5" fill="#0057a3" opacity="0.6" />

    <!-- Código de barras / QR de seguridad oficial -->
    <rect x="130" y="27" width="14" height="14" rx="1.5" fill="#0f172a" />
    <rect x="132" y="29" width="3" height="3" fill="#ffffff" />
    <rect x="139" y="29" width="3" height="3" fill="#ffffff" />
    <rect x="132" y="36" width="3" height="3" fill="#ffffff" />
    <rect x="137" y="34" width="2" height="5" fill="#ffffff" />

    <!-- Matrícula estampada oficial de 7 caracteres con relieve -->
    <g id="plate-text">
      <text x="80" y="63" font-family="'Courier New', monospace" font-size="34" font-weight="900" fill="#122142" text-anchor="middle" letter-spacing="3.5">ABC 123</text>
      <!-- Reflejo interior en los números -->
      <text x="80" y="62" font-family="'Courier New', monospace" font-size="34" font-weight="900" fill="#0057a3" text-anchor="middle" letter-spacing="3.5" opacity="0.15">ABC 123</text>
    </g>

    <!-- Franja inferior: TRANSPORTE TERRESTRE -->
    <text x="80" y="82" font-family="'Segoe UI', Inter, sans-serif" font-size="5" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1">INSTITUTO NACIONAL DE TRANSPORTE TERRESTRE</text>

    <!-- Marco de reconocimiento óptico ALPR (Bounding box del algoritmo con esquinas verdes) -->
    <g id="alpr-bounding-box" stroke="#10b981" stroke-width="2.5" stroke-linecap="round">
      <!-- Esquina superior izquierda -->
      <path d="M-8 8 L-8 -8 L8 -8" fill="none" />
      <!-- Esquina superior derecha -->
      <path d="M152 -8 L168 -8 L168 8" fill="none" />
      <!-- Esquina inferior izquierda -->
      <path d="M-8 82 L-8 98 L8 98" fill="none" />
      <!-- Esquina inferior derecha -->
      <path d="M152 98 L168 98 L168 82" fill="none" />
      <!-- Línea de escaneo láser en curso -->
      <line x1="5" y1="52" x2="155" y2="52" stroke="#00f2fe" stroke-width="1.8" opacity="0.85" filter="url(#scan-glow)" />
    </g>

    <!-- Badge de validación de OCR instantáneo -->
    <g transform="translate(100, -18)">
      <rect x="0" y="0" width="68" height="18" rx="9" fill="#122142" stroke="#10b981" stroke-width="1.5" />
      <circle cx="10" cy="9" r="4.5" fill="#10b981" />
      <path d="M8 9 L9.5 10.5 L12.5 7.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="18" y="12" font-family="'Segoe UI', Inter, sans-serif" font-size="7.5" font-weight="800" fill="#ffffff" letter-spacing="0.4">ALPR 99.8%</text>
    </g>
  </g>
</svg>
