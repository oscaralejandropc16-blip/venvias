<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Filtros de sombra y brillo -->
    <filter id="scan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="plate-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
    <filter id="cam-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="6" stdDeviation="5" flood-color="#122142" flood-opacity="0.22" />
    </filter>

    <!-- Gradientes -->
    <radialGradient id="bg-halo-2" cx="55%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#f0f9ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="scan-beam" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="85%" stop-color="#0057a3" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0057a3" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cam-housing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Definición oficial de la estrella venezolana de 5 puntas -->
    <path id="vv-star-step" d="M0,-9 2.12,-2.91 8.56,-2.78 3.42,1.11 5.29,7.28 0,3.6 -5.29,7.28 -3.42,1.11 -8.56,-2.78 -2.12,-2.91Z" fill="#ffffff" />
    <clipPath id="vv-plate-clip"><rect x="7" y="7" width="390" height="190" rx="12" /></clipPath>
  </defs>

  <!-- Halo de iluminación de fondo -->
  <ellipse cx="170" cy="100" rx="140" ry="85" fill="url(#bg-halo-2)" />

  <!-- Haz de escaneo ALPR volumétrico proyectado hacia la placa -->
  <polygon points="68,68 115,40 305,75 305,165 125,155 68,76" fill="url(#scan-beam)" />
  <line x1="68" y1="72" x2="210" y2="105" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" />
  <line x1="68" y1="72" x2="135" y2="65" stroke="#00f2fe" stroke-width="1.2" opacity="0.7" />
  <line x1="68" y1="72" x2="295" y2="140" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.6" />

  <!-- Cámara ALPR de alta velocidad con iluminación infrarroja estroboscópica -->
  <g id="alpr-camera" filter="url(#cam-shadow)">
    <!-- Brazo de montaje articulado a la estructura -->
    <path d="M12 25 L38 25 L45 55 L32 58 Z" fill="#334155" />
    <circle cx="38" cy="56" r="6" fill="#1e293b" />
    <circle cx="38" cy="56" r="3" fill="#64748b" />

    <!-- Carcasa principal aerodinámica de la cámara -->
    <path d="M36 50 L84 35 L88 78 L40 85 Z" fill="url(#cam-housing)" stroke="#94a3b8" stroke-width="0.8" />
    <!-- Visera protectora antideslumbrante -->
    <path d="M30 47 L94 28 L94 38 L34 56 Z" fill="#1e293b" />

    <!-- Frontal óptico oscuro -->
    <path d="M84 36 L92 34 L95 76 L87 78 Z" fill="#0f172a" />

    <!-- Lente ALPR principal con halo infrarrojo estroboscópico -->
    <ellipse cx="89" cy="54" rx="4.5" ry="7" fill="#0284c7" />
    <ellipse cx="90" cy="54" rx="3" ry="5" fill="#38bdf8" filter="url(#scan-glow)" />
    <ellipse cx="90.5" cy="53.5" rx="1.2" ry="2.2" fill="#ffffff" />

    <!-- Emisores LED infrarrojos estroboscópicos auxiliares -->
    <circle cx="89" cy="42" r="1.8" fill="#ef4444" opacity="0.9" />
    <circle cx="89" cy="46" r="1.8" fill="#ef4444" opacity="0.9" />
    <circle cx="89" cy="65" r="1.8" fill="#ef4444" opacity="0.9" />
    <circle cx="89" cy="69" r="1.8" fill="#ef4444" opacity="0.9" />

    <!-- Sensor LED de estado activo -->
    <circle cx="48" cy="74" r="2" fill="#22c55e" />
    <text x="53" y="76" font-family="'Segoe UI', Inter, sans-serif" font-size="4.5" font-weight="700" fill="#0057a3">ALPR ON</text>
  </g>

  <!-- ======================================================================
       PLACA VEHICULAR OFICIAL DE VENEZUELA (100% IDÉNTICA A plate-venezuela.svg)
       ====================================================================== -->
  <g id="official-venezuela-plate" transform="translate(108, 45)" filter="url(#plate-shadow)">
    <!-- Sub-escalado desde el viewBox oficial (404x204) a 198x100 -->
    <g transform="scale(0.49)">

      <!-- Marco exterior negro -->
      <rect x="2" y="2" width="400" height="200" rx="16" fill="#0d0f14" />
      <!-- Base metálica blanca reflectante -->
      <rect x="7" y="7" width="390" height="190" rx="12" fill="#ffffff" />

      <!-- Ondas tricolor oficiales de la bandera de Venezuela y estrellas -->
      <g clip-path="url(#vv-plate-clip)">
        <!-- Franja Amarilla superior -->
        <path fill="#F6CE1C" d="M7,86 C 90,70 150,102 200,86 C 260,68 330,102 397,84 L397,197 L7,197 Z" />
        <!-- Franja Azul central -->
        <path fill="#98A0E4" d="M7,118 C 90,102 150,134 200,118 C 260,100 330,134 397,116 L397,197 L7,197 Z" />
        <!-- Franja Roja inferior -->
        <path fill="#E0401C" d="M7,150 C 90,136 150,166 200,150 C 260,134 330,166 397,148 L397,197 L7,197 Z" />

        <!-- 8 Estrellas blancas formando el arco nacional sobre la franja azul -->
        <g fill="#ffffff">
          <use href="#vv-star-step" transform="translate(122,133) scale(.55)" />
          <use href="#vv-star-step" transform="translate(154,128) scale(.55)" />
          <use href="#vv-star-step" transform="translate(186,132) scale(.55)" />
          <use href="#vv-star-step" transform="translate(218,127) scale(.55)" />
          <use href="#vv-star-step" transform="translate(250,132) scale(.55)" />
          <use href="#vv-star-step" transform="translate(282,128) scale(.55)" />
          <use href="#vv-star-step" transform="translate(90,138) scale(.55)" />
          <use href="#vv-star-step" transform="translate(314,134) scale(.55)" />
        </g>
      </g>

      <!-- Ranuras de sujeción oficiales -->
      <g fill="#c7ccd4" stroke="#a6acb6" stroke-width="1">
        <rect x="150" y="9" width="30" height="12" rx="4" />
        <rect x="224" y="9" width="30" height="12" rx="4" />
        <rect x="55" y="183" width="30" height="12" rx="4" />
        <rect x="319" y="183" width="30" height="12" rx="4" />
      </g>

      <!-- Leyenda superior oficial de la República Bolivariana de Venezuela -->
      <text
        x="202"
        y="58"
        text-anchor="middle"
        font-family="'Arial Narrow', Arial, sans-serif"
        font-weight="700"
        font-size="21"
        fill="#2431be"
        textLength="360"
        lengthAdjust="spacingAndGlyphs"
      >
        REPÚBLICA BOLIVARIANA DE VENEZUELA
      </text>

      <!-- 7 CASILLAS VEHICULARES ESTÁNDAR (Idénticas a PlateImage.vue / PlateField.vue) -->
      <g transform="translate(26, 68)">
        <!-- Casilla 1: A -->
        <rect x="0" y="0" width="44" height="60" rx="4" fill="rgba(255, 255, 255, 0.95)" stroke="rgba(18, 33, 66, 0.35)" stroke-width="2" />
        <text x="22" y="44" font-family="'Courier New', monospace" font-size="40" font-weight="900" fill="#122142" text-anchor="middle">A</text>

        <!-- Casilla 2: B (Fin de grupo letras iniciales) -->
        <rect x="49" y="0" width="44" height="60" rx="4" fill="rgba(255, 255, 255, 0.95)" stroke="rgba(18, 33, 66, 0.35)" stroke-width="2" />
        <text x="71" y="44" font-family="'Courier New', monospace" font-size="40" font-weight="900" fill="#122142" text-anchor="middle">B</text>

        <!-- Separación visual de grupo -->
        <!-- Casilla 3: 1 -->
        <rect x="105" y="0" width="44" height="60" rx="4" fill="rgba(255, 255, 255, 0.95)" stroke="rgba(18, 33, 66, 0.35)" stroke-width="2" />
        <text x="127" y="44" font-family="'Courier New', monospace" font-size="40" font-weight="900" fill="#122142" text-anchor="middle">1</text>

        <!-- Casilla 4: 2 -->
        <rect x="154" y="0" width="44" height="60" rx="4" fill="rgba(255, 255, 255, 0.95)" stroke="rgba(18, 33, 66, 0.35)" stroke-width="2" />
        <text x="176" y="44" font-family="'Courier New', monospace" font-size="40" font-weight="900" fill="#122142" text-anchor="middle">2</text>

        <!-- Casilla 5: 3 (Fin de grupo numérico) -->
        <rect x="203" y="0" width="44" height="60" rx="4" fill="rgba(255, 255, 255, 0.95)" stroke="rgba(18, 33, 66, 0.35)" stroke-width="2" />
        <text x="225" y="44" font-family="'Courier New', monospace" font-size="40" font-weight="900" fill="#122142" text-anchor="middle">3</text>

        <!-- Separación visual de grupo -->
        <!-- Casilla 6: C -->
        <rect x="259" y="0" width="44" height="60" rx="4" fill="rgba(255, 255, 255, 0.95)" stroke="rgba(18, 33, 66, 0.35)" stroke-width="2" />
        <text x="281" y="44" font-family="'Courier New', monospace" font-size="40" font-weight="900" fill="#122142" text-anchor="middle">C</text>

        <!-- Casilla 7: D -->
        <rect x="308" y="0" width="44" height="60" rx="4" fill="rgba(255, 255, 255, 0.95)" stroke="rgba(18, 33, 66, 0.35)" stroke-width="2" />
        <text x="330" y="44" font-family="'Courier New', monospace" font-size="40" font-weight="900" fill="#122142" text-anchor="middle">D</text>
      </g>

      <!-- Leyenda inferior oficial: CARACAS -->
      <text x="202" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="#15205c" letter-spacing="3">CARACAS</text>
    </g>

    <!-- Marco de reconocimiento óptico ALPR (Bounding box del algoritmo con esquinas verdes) -->
    <g id="alpr-bounding-box" stroke="#10b981" stroke-width="2.5" stroke-linecap="round">
      <!-- Esquina superior izquierda -->
      <path d="M-8 8 L-8 -8 L8 -8" fill="none" />
      <!-- Esquina superior derecha -->
      <path d="M188 -8 L204 -8 L204 8" fill="none" />
      <!-- Esquina inferior izquierda -->
      <path d="M-8 90 L-8 106 L8 106" fill="none" />
      <!-- Esquina inferior derecha -->
      <path d="M188 106 L204 106 L204 90" fill="none" />
      <!-- Línea de escaneo láser en curso -->
      <line x1="2" y1="50" x2="194" y2="50" stroke="#00f2fe" stroke-width="1.8" opacity="0.85" filter="url(#scan-glow)" />
    </g>

    <!-- Badge de validación de OCR instantáneo -->
    <g transform="translate(132, -18)">
      <rect x="0" y="0" width="68" height="18" rx="9" fill="#122142" stroke="#10b981" stroke-width="1.5" />
      <circle cx="10" cy="9" r="4.5" fill="#10b981" />
      <path d="M8 9 L9.5 10.5 L12.5 7.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="18" y="12" font-family="'Segoe UI', Inter, sans-serif" font-size="7.5" font-weight="800" fill="#ffffff" letter-spacing="0.4">ALPR 99.8%</text>
    </g>
  </g>
</svg>
