<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Filtros de sombra suave -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="car-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
    <filter id="gantry-shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#122142" flood-opacity="0.15" />
    </filter>

    <!-- Gradientes -->
    <radialGradient id="bg-halo-1" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#f0f9ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="road-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="40%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="gantry-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#122142" />
      <stop offset="50%" stop-color="#0057a3" />
      <stop offset="100%" stop-color="#122142" />
    </linearGradient>

    <linearGradient id="car-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="car-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="tail-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Halo de iluminación de fondo -->
  <ellipse cx="160" cy="110" rx="145" ry="85" fill="url(#bg-halo-1)" />

  <!-- Calzada / Autopista en perspectiva -->
  <g id="road-surface">
    <!-- Base de asfalto -->
    <path d="M100 75 L220 75 L295 190 L25 190 Z" fill="url(#road-grad)" />

    <!-- Líneas de borde reflectantes -->
    <path d="M100 75 L25 190" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <path d="M220 75 L295 190" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

    <!-- Líneas centrales punteadas en perspectiva -->
    <line x1="160" y1="80" x2="160" y2="92" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="160" y1="102" x2="160" y2="120" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <line x1="160" y1="135" x2="160" y2="162" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.95" />
    <line x1="160" y1="178" x2="160" y2="190" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Ondas RF de telepeaje Free Flow desde el pórtico hacia la vía -->
  <g id="rf-waves" opacity="0.75">
    <path d="M135 62 Q160 76 185 62" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M125 70 Q160 88 195 70" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M115 79 Q160 102 205 79" stroke="#0057a3" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" fill="none" opacity="0.6" />
  </g>

  <!-- Pórtico inteligente Free Flow (Estructura aérea de peaje) -->
  <g id="gantry-structure" filter="url(#gantry-shadow)">
    <!-- Columnas laterales -->
    <path d="M52 165 L52 46 L62 46 L62 165 Z" fill="#1e293b" />
    <path d="M258 165 L258 46 L268 46 L268 165 Z" fill="#1e293b" />
    <!-- Viga superior principal -->
    <rect x="46" y="38" width="228" height="15" rx="3" fill="url(#gantry-beam)" />
    <!-- Viga técnica de sensores -->
    <rect x="58" y="53" width="204" height="6" rx="2" fill="#0f172a" />

    <!-- Celosía de refuerzo arquitectónico -->
    <line x1="65" y1="40" x2="80" y2="53" stroke="#5fa8e8" stroke-width="1.2" opacity="0.6" />
    <line x1="95" y1="40" x2="110" y2="53" stroke="#5fa8e8" stroke-width="1.2" opacity="0.6" />
    <line x1="210" y1="40" x2="225" y2="53" stroke="#5fa8e8" stroke-width="1.2" opacity="0.6" />
    <line x1="240" y1="40" x2="255" y2="53" stroke="#5fa8e8" stroke-width="1.2" opacity="0.6" />

    <!-- Sensores de lectura ALPR y transceptor TAG en pórtico -->
    <g id="sensors">
      <!-- Sensor carril izquierdo -->
      <rect x="110" y="53" width="16" height="10" rx="2" fill="#0284c7" />
      <circle cx="118" cy="58" r="2.5" fill="#38bdf8" />

      <!-- Sensor central ALPR de alta velocidad -->
      <rect x="150" y="53" width="20" height="12" rx="2.5" fill="#122142" stroke="#0057a3" stroke-width="1" />
      <circle cx="160" cy="59" r="3" fill="#22c55e" />
      <circle cx="160" cy="59" r="1.2" fill="#ffffff" />

      <!-- Sensor carril derecho -->
      <rect x="194" y="53" width="16" height="10" rx="2" fill="#0284c7" />
      <circle cx="202" cy="58" r="2.5" fill="#38bdf8" />
    </g>

    <!-- Indicador luminoso LED en pórtico: Vía Abierta Free Flow -->
    <rect x="135" y="41" width="50" height="9" rx="2" fill="#0f172a" />
    <circle cx="144" cy="45.5" r="2" fill="#22c55e" />
    <circle cx="176" cy="45.5" r="2" fill="#22c55e" />
    <text x="160" y="48.5" font-family="'Segoe UI', Inter, sans-serif" font-size="6.5" font-weight="800" fill="#22c55e" text-anchor="middle" letter-spacing="1">FREE FLOW</text>
  </g>

  <!-- Vehículo en tránsito libre y continuo (SUV moderno) -->
  <g id="vehicle" filter="url(#car-shadow)">
    <!-- Sombra de contacto en calzada -->
    <ellipse cx="160" cy="178" rx="66" ry="11" fill="#0f172a" opacity="0.45" />

    <!-- Ruedas traseras con neumáticos anchos -->
    <rect x="100" y="148" width="18" height="26" rx="5" fill="#0f172a" />
    <rect x="102" y="152" width="14" height="18" rx="3" fill="#334155" />
    <rect x="202" y="148" width="18" height="26" rx="5" fill="#0f172a" />
    <rect x="204" y="152" width="14" height="18" rx="3" fill="#334155" />

    <!-- Carrocería principal (SUV) -->
    <!-- Techo y pilares traseros -->
    <path d="M125 102 Q160 98 195 102 L206 126 Q160 125 114 126 Z" fill="url(#car-glass)" />
    <!-- Luneta trasera tintada con reflejo -->
    <path d="M127 104 Q160 101 193 104 L202 124 Q160 123 118 124 Z" fill="#0f172a" />
    <path d="M130 106 L145 106 L138 122 L125 122 Z" fill="#38bdf8" opacity="0.3" />

    <!-- Cuerpo / Maletero -->
    <path d="M106 126 Q160 123 214 126 L220 152 Q160 155 100 152 Z" fill="url(#car-body)" />
    <!-- Línea de acento aerodinámica trasera -->
    <path d="M103 140 Q160 144 217 140" stroke="#94a3b8" stroke-width="1.2" fill="none" />

    <!-- Luces traseras LED horizontales -->
    <g id="taillights">
      <!-- Luz izquierda -->
      <path d="M104 130 L132 131 L130 137 L106 136 Z" fill="url(#tail-light)" />
      <path d="M106 132 L130 133" stroke="#fca5a5" stroke-width="1" />
      <!-- Barra LED continua moderna -->
      <line x1="132" y1="133" x2="188" y2="133" stroke="#ef4444" stroke-width="2" opacity="0.85" />
      <!-- Luz derecha -->
      <path d="M188 131 L216 130 L214 136 L190 137 Z" fill="url(#tail-light)" />
      <path d="M190 133 L214 132" stroke="#fca5a5" stroke-width="1" />
    </g>

    <!-- Parachoques inferior y difusor -->
    <path d="M102 150 Q160 153 218 150 L214 168 Q160 172 106 168 Z" fill="#1e293b" />
    <rect x="135" y="166" width="50" height="4" rx="2" fill="#0f172a" />
    <!-- Tubos de escape estilizados -->
    <rect x="115" y="166" width="10" height="3" rx="1.5" fill="#64748b" />
    <rect x="195" y="166" width="10" height="3" rx="1.5" fill="#64748b" />

    <!-- Placa de matrícula trasera venezolana oficial -->
    <g id="license-plate" transform="translate(141, 142)">
      <!-- Marco portaplacas -->
      <rect x="-1" y="-1" width="40" height="18" rx="2.5" fill="#0f172a" />
      <!-- Placa blanca reflectante -->
      <rect x="0" y="0" width="38" height="16" rx="2" fill="#ffffff" stroke="#0057a3" stroke-width="0.8" />
      <!-- Franja superior azul Venezuela -->
      <rect x="1" y="1" width="36" height="3.5" rx="1" fill="#0057a3" />
      <text x="19" y="3.8" font-family="'Segoe UI', Inter, sans-serif" font-size="2.6" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">VENEZUELA</text>
      <!-- Matrícula -->
      <text x="19" y="12.5" font-family="'Courier New', monospace" font-size="7.5" font-weight="900" fill="#122142" text-anchor="middle" letter-spacing="1.2">ABC 123</text>
    </g>
  </g>

  <!-- Destellos y líneas de flujo libre continuo -->
  <g id="flow-arrows" opacity="0.85">
    <path d="M35 178 L55 178" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <path d="M40 184 L65 184" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
    <path d="M285 178 L265 178" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <path d="M280 184 L255 184" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
