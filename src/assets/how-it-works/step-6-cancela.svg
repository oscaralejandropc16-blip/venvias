<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Filtros de sombra -->
    <filter id="booth-shadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
    <filter id="car-shadow-6" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
    <filter id="receipt-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#16a34a" flood-opacity="0.3" />
    </filter>

    <!-- Gradientes -->
    <radialGradient id="bg-halo-6" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#f0f9ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="booth-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="booth-roof" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#122142" />
      <stop offset="50%" stop-color="#0057a3" />
      <stop offset="100%" stop-color="#122142" />
    </linearGradient>

    <linearGradient id="car-body-6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="success-seal-6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
  </defs>

  <!-- Halo de fondo -->
  <ellipse cx="160" cy="100" rx="140" ry="85" fill="url(#bg-halo-6)" />

  <!-- Calzada / Vía de Peaje -->
  <path d="M10 185 L310 185 L280 130 L40 130 Z" fill="#475569" opacity="0.8" />
  <line x1="30" y1="185" x2="60" y2="130" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="290" y1="185" x2="260" y2="130" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="160" y1="185" x2="160" y2="140" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 6" opacity="0.8" />

  <!-- Estación / Caseta de Peaje Oficial -->
  <g id="toll-booth" transform="translate(198, 48)" filter="url(#booth-shadow)">
    <!-- Base de concreto -->
    <rect x="-8" y="98" width="80" height="15" rx="3" fill="#334155" />
    <rect x="-6" y="98" width="76" height="4" rx="2" fill="#64748b" />

    <!-- Estructura de la cabina -->
    <rect x="0" y="24" width="64" height="74" rx="4" fill="url(#booth-body)" stroke="#64748b" stroke-width="1.2" />

    <!-- Ventanilla de atención al usuario -->
    <rect x="8" y="34" width="48" height="36" rx="3" fill="#0f172a" />
    <rect x="10" y="36" width="44" height="32" rx="2" fill="#38bdf8" opacity="0.3" />
    <line x1="12" y1="64" x2="40" y2="38" stroke="#ffffff" stroke-width="1.5" opacity="0.5" />

    <!-- Techo / Voladizo superior -->
    <path d="M-6 24 L70 24 L64 12 L0 12 Z" fill="url(#booth-roof)" />

    <!-- Letrero superior de la Estación de Peaje -->
    <rect x="-14" y="-8" width="92" height="22" rx="4" fill="#0057a3" stroke="#122142" stroke-width="1.5" />
    <text x="32" y="1.5" font-family="'Segoe UI', Inter, sans-serif" font-size="6" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">ESTACIÓN</text>
    <text x="32" y="9.5" font-family="'Segoe UI', Inter, sans-serif" font-size="6" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">DE PEAJE</text>

    <!-- Poste de la Barrera de paso -->
    <g transform="translate(-18, 18)">
      <!-- Base de barrera con franjas rojo/blanco -->
      <rect x="0" y="22" width="10" height="60" rx="2" fill="#1e293b" />
      <circle cx="5" cy="28" r="4" fill="#64748b" />

      <!-- Brazo de barrera LEVANTADO en posición vertical (vía libre) -->
      <g transform="translate(5, 28) rotate(-78)">
        <rect x="0" y="-3" width="75" height="6" rx="2" fill="#ffffff" stroke="#ef4444" stroke-width="0.8" />
        <!-- Franjas rojas reflectantes de la barrera -->
        <rect x="10" y="-3" width="10" height="6" fill="#ef4444" />
        <rect x="30" y="-3" width="10" height="6" fill="#ef4444" />
        <rect x="50" y="-3" width="10" height="6" fill="#ef4444" />
        <rect x="68" y="-3" width="7" height="6" fill="#ef4444" />
      </g>
    </g>
  </g>

  <!-- Vehículo regularizado saliendo por el carril libre -->
  <g id="cleared-vehicle" transform="translate(70, 92)" filter="url(#car-shadow-6)">
    <!-- Sombra de calzada -->
    <ellipse cx="55" cy="74" rx="42" ry="7" fill="#0f172a" opacity="0.4" />

    <!-- Ruedas -->
    <rect x="16" y="55" width="12" height="18" rx="3" fill="#0f172a" />
    <rect x="82" y="55" width="12" height="18" rx="3" fill="#0f172a" />

    <!-- Carrocería SUV -->
    <path d="M30 20 Q55 17 80 20 L88 38 Q55 37 22 38 Z" fill="#0f172a" />
    <!-- Luneta trasera tintada -->
    <path d="M32 22 Q55 19 78 22 L84 36 Q55 35 26 36 Z" fill="#1e293b" />
    <path d="M35 24 L48 24 L42 35 L30 35 Z" fill="#38bdf8" opacity="0.35" />

    <!-- Cuerpo posterior -->
    <path d="M20 38 Q55 35 90 38 L94 58 Q55 61 16 58 Z" fill="url(#car-body-6)" />

    <!-- Luces traseras rojas -->
    <rect x="18" y="42" width="18" height="5" rx="2" fill="#ef4444" />
    <rect x="74" y="42" width="18" height="5" rx="2" fill="#ef4444" />
    <line x1="36" y1="44.5" x2="74" y2="44.5" stroke="#ef4444" stroke-width="1.2" opacity="0.8" />

    <!-- Parachoques -->
    <path d="M16 56 Q55 58 94 56 L91 68 Q55 70 19 68 Z" fill="#1e293b" />

    <!-- Placa trasera oficial venezolana (formato oficial de 7 caracteres) -->
    <g transform="translate(37, 51)">
      <!-- Marco negro -->
      <rect x="-1" y="-1" width="38" height="18" rx="2" fill="#0d0f14" />
      <!-- Base blanca -->
      <rect x="0" y="0" width="36" height="16" rx="1.5" fill="#ffffff" />

      <!-- Ondas tricolor Venezuela en la mitad inferior -->
      <path fill="#F6CE1C" d="M1,8 C 8,6.5 15,9.5 19,8 C 24,6.5 30,9.5 35,7.5 L35,15 L1,15 Z" />
      <path fill="#98A0E4" d="M1,10.5 C 8,9 15,12 19,10.5 C 24,9 30,12 35,10 L35,15 L1,15 Z" />
      <path fill="#E0401C" d="M1,13 C 8,11.5 15,14.5 19,13 C 24,11.5 30,14.5 35,12.5 L35,15 L1,15 Z" />

      <!-- Estrellas simplificadas en la franja azul -->
      <circle cx="15" cy="11.2" r="0.35" fill="#ffffff" />
      <circle cx="18" cy="10.8" r="0.35" fill="#ffffff" />
      <circle cx="21" cy="11.2" r="0.35" fill="#ffffff" />

      <!-- Leyenda superior oficial -->
      <text x="18" y="3.2" font-family="'Arial Narrow', Arial, sans-serif" font-size="1.9" font-weight="700" fill="#2431be" text-anchor="middle" letter-spacing="0.2">REPÚBLICA BOLIVARIANA DE VENEZUELA</text>

      <!-- Matrícula oficial de 7 caracteres -->
      <text x="18" y="9.5" font-family="'Courier New', monospace" font-size="5.8" font-weight="900" fill="#122142" text-anchor="middle" letter-spacing="0.6">AB 123 CD</text>

      <!-- Leyenda inferior -->
      <text x="18" y="15" font-family="Arial, sans-serif" font-size="1.4" font-weight="700" fill="#15205c" text-anchor="middle" letter-spacing="0.2">CARACAS</text>
    </g>
  </g>

  <!-- Gran Sello Flotante: DEUDA CANCELADA · LIBERADO -->
  <g id="released-seal" transform="translate(18, 32)" filter="url(#receipt-shadow)">
    <!-- Círculo exterior blanco de realce -->
    <circle cx="28" cy="28" r="28" fill="#ffffff" />
    <!-- Círculo interior verde éxito con gradiente -->
    <circle cx="28" cy="28" r="25" fill="url(#success-seal-6)" stroke="#ffffff" stroke-width="2.5" />
    <!-- Checkmark grande -->
    <path d="M18 28 L25 35 L39 20" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Badge complementario inferior -->
    <g transform="translate(-10, 48)">
      <rect x="0" y="0" width="76" height="18" rx="9" fill="#122142" stroke="#22c55e" stroke-width="1.2" />
      <text x="38" y="12" font-family="'Segoe UI', Inter, sans-serif" font-size="6.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">LIBERADO ✓</text>
    </g>
  </g>

  <!-- Icono de Pago Web y en Taquilla -->
  <g transform="translate(14, 138)">
    <rect x="0" y="0" width="88" height="24" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
    <text x="8" y="15" font-family="'Segoe UI', Inter, sans-serif" font-size="7.5" font-weight="800" fill="#0057a3">WEB O PEAJE</text>
    <!-- Check pequeño -->
    <circle cx="76" cy="12" r="5" fill="#10b981" />
    <path d="M74 12 L75.5 13.5 L78 10.5" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
