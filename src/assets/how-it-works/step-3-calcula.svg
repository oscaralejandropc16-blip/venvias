<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Filtros de sombra -->
    <filter id="doc-shadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0057a3" flood-opacity="0.25" />
    </filter>
    <filter id="glow-calc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradientes -->
    <radialGradient id="bg-halo-3" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#f0f9ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#122142" />
      <stop offset="100%" stop-color="#0057a3" />
    </linearGradient>

    <linearGradient id="seal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0057a3" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Halo de fondo -->
  <ellipse cx="160" cy="100" rx="140" ry="85" fill="url(#bg-halo-3)" />

  <!-- Flechas y flujo de entrada de datos hacia el cálculo -->
  <g id="input-flow" opacity="0.8">
    <path d="M45 100 L75 100" stroke="#0057a3" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="75,95 85,100 75,105" fill="#0057a3" />
    <circle cx="35" cy="100" r="4" fill="#38bdf8" />
  </g>

  <!-- Engranajes de cálculo automático en segundo plano -->
  <g id="gears-bg" opacity="0.4" transform="translate(75, 45)">
    <!-- Engranaje grande -->
    <circle cx="30" cy="30" r="18" fill="none" stroke="#0057a3" stroke-width="4" stroke-dasharray="6 3" />
    <circle cx="30" cy="30" r="8" fill="#5fa8e8" />
    <!-- Engranaje pequeño -->
    <circle cx="54" cy="50" r="12" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 2" />
    <circle cx="54" cy="50" r="5" fill="#0284c7" />
  </g>

  <!-- Documento de Tarifa de Peaje (Hoja contable oficial) -->
  <g id="rate-document" transform="translate(105, 22)" filter="url(#doc-shadow)">
    <!-- Hoja de papel base -->
    <rect x="0" y="0" width="135" height="156" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />

    <!-- Encabezado con franja azul marino institucional -->
    <path d="M0 8 Q0 0 8 0 L127 0 Q135 0 135 8 L135 34 L0 34 Z" fill="url(#header-grad)" />

    <!-- Título dentro del encabezado -->
    <text x="67.5" y="16" font-family="'Segoe UI', Inter, sans-serif" font-size="7.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">TARIFA DE PEAJE</text>
    <text x="67.5" y="27" font-family="'Segoe UI', Inter, sans-serif" font-size="5.5" font-weight="600" fill="#93c5fd" text-anchor="middle" letter-spacing="0.5">SISTEMA AUTOMATIZADO</text>

    <!-- Ícono de balanza / tarifa en encabezado -->
    <circle cx="16" cy="17" r="6" fill="#0f172a" opacity="0.4" />
    <text x="16" y="20.5" font-family="'Segoe UI', Inter, sans-serif" font-size="9" font-weight="900" fill="#38bdf8" text-anchor="middle">$</text>

    <!-- Filas de datos del cálculo oficial -->
    <!-- Fila 1: Categoría vehicular -->
    <g transform="translate(12, 44)">
      <rect x="0" y="0" width="111" height="18" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="8" y="12" font-family="'Segoe UI', Inter, sans-serif" font-size="5.5" font-weight="700" fill="#475569">CATEGORÍA:</text>
      <text x="60" y="12" font-family="'Segoe UI', Inter, sans-serif" font-size="6" font-weight="800" fill="#0057a3">LIVIANO (CAT. 1)</text>
    </g>

    <!-- Fila 2: Punto de control -->
    <g transform="translate(12, 66)">
      <rect x="0" y="0" width="111" height="18" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="8" y="12" font-family="'Segoe UI', Inter, sans-serif" font-size="5.5" font-weight="700" fill="#475569">CONTROL:</text>
      <text x="60" y="12" font-family="'Segoe UI', Inter, sans-serif" font-size="6" font-weight="800" fill="#122142">PEAJE PRINCIPAL</text>
    </g>

    <!-- Separador punteado -->
    <line x1="12" y1="92" x2="123" y2="92" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 2" />

    <!-- Total a cobrar / Tarifa calculada -->
    <g transform="translate(12, 98)">
      <text x="8" y="12" font-family="'Segoe UI', Inter, sans-serif" font-size="6" font-weight="700" fill="#64748b">TASA APLICABLE</text>
      <!-- Símbolo grande de cálculo oficial -->
      <g transform="translate(8, 20)">
        <rect x="0" y="0" width="95" height="24" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
        <text x="12" y="16.5" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="900" fill="#0057a3">TASA OFICIAL</text>
        <!-- Icono check verde -->
        <circle cx="82" cy="12" r="6" fill="#10b981" />
        <path d="M79.5 12 L81.5 14 L85 10" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Línea decorativa final -->
    <rect x="35" y="148" width="65" height="3" rx="1.5" fill="#cbd5e1" />
  </g>

  <!-- Gran Sello Oficial de Cálculo Automático flotante -->
  <g id="official-seal" transform="translate(210, 110)" filter="url(#badge-shadow)">
    <!-- Círculo exterior dorado -->
    <circle cx="26" cy="26" r="26" fill="url(#gold-grad)" />
    <!-- Círculo interior azul marino -->
    <circle cx="26" cy="26" r="22" fill="#122142" stroke="#fbbf24" stroke-width="1.5" />

    <!-- Símbolo de moneda / cálculo central -->
    <text x="26" y="34" font-family="'Segoe UI', Inter, sans-serif" font-size="22" font-weight="900" fill="#fbbf24" text-anchor="middle">$</text>

    <!-- Rayos de brillo superior -->
    <circle cx="16" cy="16" r="2" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Micro Badge: CÁLCULO INMEDIATO -->
  <g transform="translate(20, 150)">
    <rect x="0" y="0" width="85" height="20" rx="10" fill="#122142" stroke="#38bdf8" stroke-width="1" />
    <circle cx="10" cy="10" r="4" fill="#22c55e" />
    <text x="18" y="13.5" font-family="'Segoe UI', Inter, sans-serif" font-size="6" font-weight="800" fill="#ffffff" letter-spacing="0.5">TASA VALIDADA</text>
  </g>
</svg>
