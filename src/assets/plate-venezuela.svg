<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 404 204" role="img" aria-label="Placa vehicular de Venezuela">
  <defs>
    <clipPath id="vv-face"><rect x="7" y="7" width="390" height="190" rx="12"/></clipPath>
    <path id="vv-star" d="M0,-9 2.12,-2.91 8.56,-2.78 3.42,1.11 5.29,7.28 0,3.6 -5.29,7.28 -3.42,1.11 -8.56,-2.78 -2.12,-2.91Z"/>
  </defs>

  <!-- frame -->
  <rect x="2" y="2" width="400" height="200" rx="16" fill="#0d0f14"/>
  <rect x="7" y="7" width="390" height="190" rx="12" fill="#ffffff"/>

  <g clip-path="url(#vv-face)">
    <!-- tricolor waves: yellow (top) → blue → red, each painted over and extended to the base -->
    <path fill="#F6CE1C" d="M7,86 C 90,70 150,102 200,86 C 260,68 330,102 397,84 L397,197 L7,197 Z"/>
    <path fill="#98A0E4" d="M7,118 C 90,102 150,134 200,118 C 260,100 330,134 397,116 L397,197 L7,197 Z"/>
    <path fill="#E0401C" d="M7,150 C 90,136 150,166 200,150 C 260,134 330,166 397,148 L397,197 L7,197 Z"/>

    <!-- stars along the blue band -->
    <g fill="#ffffff">
      <use href="#vv-star" transform="translate(122,133) scale(.55)"/>
      <use href="#vv-star" transform="translate(154,128) scale(.55)"/>
      <use href="#vv-star" transform="translate(186,132) scale(.55)"/>
      <use href="#vv-star" transform="translate(218,127) scale(.55)"/>
      <use href="#vv-star" transform="translate(250,132) scale(.55)"/>
      <use href="#vv-star" transform="translate(282,128) scale(.55)"/>
      <use href="#vv-star" transform="translate(90,138) scale(.55)"/>
      <use href="#vv-star" transform="translate(314,134) scale(.55)"/>
    </g>
  </g>

  <!-- mounting tabs -->
  <g fill="#c7ccd4" stroke="#a6acb6" stroke-width="1">
    <rect x="150" y="9" width="30" height="12" rx="4"/>
    <rect x="224" y="9" width="30" height="12" rx="4"/>
    <rect x="55" y="183" width="30" height="12" rx="4"/>
    <rect x="319" y="183" width="30" height="12" rx="4"/>
  </g>

  <!-- legends (no plate number) -->
  <text x="202" y="60" text-anchor="middle" font-family="'Arial Narrow',Arial,sans-serif" font-weight="700" font-size="21" fill="#2431be" textLength="360" lengthAdjust="spacingAndGlyphs">REPÚBLICA BOLIVARIANA DE VENEZUELA</text>
  <text x="202" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="17" fill="#15205c" letter-spacing="3">CARACAS</text>
</svg>
